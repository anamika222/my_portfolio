{% extends 'index.html' %}
{% load static %}

{% block content %}
<section class="py-16 md:py-32 bg-[#050505] min-h-screen text-white">
    <div class="max-w-7xl mx-auto px-6">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 lg:gap-16 items-center">
            
            <div class="rounded-[30px] md:rounded-[40px] overflow-hidden border border-white/10 shadow-2xl order-1">
                <img src="{{ course.thumbnail.url }}" alt="{{ course.title }}" class="w-full h-auto object-cover transition-transform duration-700 hover:scale-105">
            </div>

            <div class="space-y-6 md:space-y-8 order-2">
                <div class="space-y-4">
                    <span class="text-[#d4af37] tracking-[0.2em] md:tracking-[0.3em] uppercase text-[10px] md:text-xs font-bold block">Premium Course</span>
                    <h1 class="text-3xl md:text-4xl lg:text-5xl font-serif leading-tight text-white">{{ course.title }}</h1>
                </div>
                
                <div class="flex flex-wrap gap-5 md:gap-8 text-gray-400 text-xs md:text-sm border-y border-white/5 py-5">
                    <div class="flex items-center">
                        <i class="far fa-clock text-[#d4af37] mr-2 md:mr-3"></i>
                        <span>{{ course.duration }}</span>
                    </div>
                    <div class="flex items-center">
                        <i class="fas fa-book text-[#d4af37] mr-2 md:mr-3"></i>
                        <span>{{ course.total_lessons }} Lessons</span>
                    </div>
                </div>

                <div class="text-gray-400 leading-relaxed text-base md:text-lg font-light">
                    {{ course.description|linebreaks }}
                </div>

                <div class="bg-[#111] p-6 md:p-10 rounded-[24px] md:rounded-[32px] border border-white/5 flex flex-col md:flex-row justify-between items-center gap-6">
                    <div class="text-center md:text-left">
                        <p class="text-gray-500 text-[10px] md:text-xs uppercase tracking-widest mb-1 md:mb-2">Course Fee</p>
                        <p class="text-3xl md:text-4xl font-serif text-white">৳ {{ course.price }}</p>
                    </div>
                    
                    {% if course.enroll_link %}
                    <a href="{{ course.enroll_link }}" target="_blank" class="w-full md:w-auto bg-[#d4af37] text-black px-8 md:px-10 py-4 md:py-5 rounded-xl md:rounded-2xl font-black text-[10px] md:text-xs uppercase tracking-[0.2em] hover:bg-white hover:scale-105 transition-all text-center">
                        Enroll Now
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
